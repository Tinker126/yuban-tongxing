<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#317669">
  <title>学生登录 · 语伴童行</title>
  <link rel="icon" href="/buddy.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/student-auth-page.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/"><span class="brand-icon">Hi!</span><span>语伴童行<small>YOUR ENGLISH BUDDY</small></span></a>
    <a class="teacher-link" href="/">返回练习</a>
  </header>
  <main class="login-wrap">
    <span class="eyebrow">HELLO AGAIN</span>
    <h1>欢迎回来</h1>
    <p class="muted">登录后继续英语口语练习。</p>
    <form data-auth-form="login">
      <label class="form-field" for="username">学生账号
        <input id="username" name="username" required maxlength="32" autocomplete="username">
      </label>
      <label class="form-field" for="password">密码
        <input id="password" name="password" type="password" required maxlength="128" autocomplete="current-password">
      </label>
      <button class="primary full" type="submit">登录并开始练习 →</button>
    </form>
    <p id="status" class="notice" role="status" aria-live="polite"></p>
    <p class="mini">还没有账号？<a href="/register">注册学生账号</a></p>
  </main>
</body>
</html>

# Replace domain in server_name AND both certificate paths before using.
server {
    listen 80;
    server_name practice.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name practice.example.com;
    ssl_certificate /etc/letsencrypt/live/practice.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/practice.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 512k;
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    # Defense in depth. Never add an alias/root pointing at the project directory.
    location ~ /\. { deny all; }
    location ~* ^/(data|src|scripts|test|deploy)/ { deny all; }
}
